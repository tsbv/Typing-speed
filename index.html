<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="description" content="Typing Speed — тест скорости печати на русском и английском языке с живым WPM, точностью и графиком результата">
<title>Typing Speed</title>
<style>
  :root {
    --bg: #121316;
    --panel: #191b20;
    --line: #262932;
    --muted: #5c6070;
    --text: #e8eaf0;
    --err: #ff5c6c;
    --accent: #ffd166;
    --fs: clamp(22px, 3vw, 34px);
    --mono: Consolas, "JetBrains Mono", "Cascadia Mono", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html { height: 100%; overflow: hidden; }
  body {
    margin: 0;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 16px; letter-spacing: 0.01em; }
  .brand svg { color: var(--accent); }
  .hint {
    margin-left: auto;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hint kbd {
    font-family: var(--mono);
    font-size: 11px;
    padding: 1px 5px;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: var(--panel);
    color: #9aa0b0;
  }

  .bar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
  }
  .seg {
    display: flex;
    gap: 2px;
    padding: 3px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .seg button {
    height: 30px;
    padding: 0 12px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    transition: background 0.18s, color 0.18s;
  }
  .seg button:hover { color: #aeb4c4; }
  .seg button[aria-pressed="true"] { background: #2b2f3a; color: var(--text); }
  .btn {
    height: 38px;
    padding: 0 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    font-size: 14px;
    font-weight: 600;
    transition: background 0.18s, border-color 0.18s, color 0.18s;
  }
  .btn:hover { background: #21242c; }
  .btn.icon { width: 38px; padding: 0; margin-left: auto; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1405; }
  .btn.primary:hover { background: #ffdc8a; border-color: #ffdc8a; }

  .meta {
    flex: none;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 18px 4px;
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .meta b { color: var(--accent); font-weight: 700; }

  .stage {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 18px;
    overflow: hidden;
  }
  .test { width: 100%; max-width: 1000px; position: relative; }
  .viewport { overflow: hidden; position: relative; }
  .track { position: relative; transition: transform 0.22s ease; will-change: transform; }
  .words { display: flex; flex-wrap: wrap; align-content: flex-start; }
  .w {
    display: block;
    white-space: nowrap;
    margin-right: 0.55em;
    font-family: var(--mono);
    font-size: var(--fs);
    line-height: 1.62;
    color: var(--muted);
    transition: color 0.18s;
  }
  .w.err { text-decoration: underline; text-decoration-color: var(--err); text-underline-offset: 5px; }
  .l { color: var(--muted); transition: color 0.12s; }
  .l.ok { color: var(--text); }
  .l.bad { color: var(--err); text-decoration: underline; text-underline-offset: 4px; }
  .l.x { display: none; }
  .l.x.on { display: inline; color: var(--err); text-decoration: underline; text-underline-offset: 4px; }
  .l.caret { border-left: 2px solid var(--accent); margin-left: -2px; animation: caret 1.06s steps(1, end) infinite; }
  .ce { display: inline-block; width: 2px; height: 1em; vertical-align: -0.16em; background: transparent; }
  .ce.on { background: var(--accent); animation: caretBg 1.06s steps(1, end) infinite; }
  @keyframes caret { 0%, 49% { border-left-color: var(--accent); } 50%, 100% { border-left-color: transparent; } }
  @keyframes caretBg { 0%, 49% { background-color: var(--accent); } 50%, 100% { background-color: transparent; } }

  .typeinput {
    position: absolute;
    left: 0;
    top: 0;
    width: 1px;
    height: 1px;
    padding: 0;
    border: 0;
    opacity: 0;
    font-size: 16px;
    background: transparent;
    color: transparent;
    resize: none;
    z-index: 2;
  }

  .result {
    display: none;
    width: 100%;
    max-width: 1000px;
    height: 100%;
    flex-direction: column;
    gap: 10px;
    padding: 2px 0 6px;
    min-height: 0;
  }
  body[data-screen="result"] .result { display: flex; }
  body[data-screen="result"] .test { display: none; }
  .res-top { flex: none; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .res-wpm { font-family: var(--mono); font-size: clamp(38px, 6vw, 58px); font-weight: 700; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
  .res-unit { font-size: 13px; color: var(--muted); }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 26px;
    padding: 0 10px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--panel);
    font-size: 12px;
    font-weight: 600;
    color: #aeb4c4;
  }
  .chip.rec { border-color: var(--accent); color: var(--accent); }
  .res-stats { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .cell { padding: 7px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); min-width: 0; }
  .cell span { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell b { display: block; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .cell b.err { color: var(--err); }
  .chart-wrap { flex: 1; min-height: 0; position: relative; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; }
  .chart-wrap canvas { display: block; width: 100%; height: 100%; }
  .res-actions { flex: none; display: flex; gap: 10px; }

  @media (max-width: 560px) {
    header { padding: 8px 12px; gap: 8px; }
    .brand { font-size: 14px; }
    .brand svg { width: 16px; height: 16px; }
    .hint { font-size: 10px; }
    .hint kbd { font-size: 9px; padding: 0 3px; }
    .bar { padding: 8px 12px; gap: 8px; }
    .seg { padding: 2px; gap: 1px; }
    .seg button { height: 28px; padding: 0 8px; font-size: 12px; }
    .btn.icon { width: 34px; height: 34px; }
    .meta { padding: 0 12px 2px; font-size: 12px; gap: 12px; }
    .stage { padding: 0 12px; }
    .res-stats { grid-template-columns: repeat(2, 1fr); }
    .cell b { font-size: 15px; }
    .res-wpm { font-size: 34px; }
    .chart-wrap { flex: 0 0 auto; height: 190px; min-height: 0; }
    .res-actions { margin-top: auto; }
    .res-actions .btn { flex: 1; }
  }
  @media (max-height: 700px) {
    .chart-wrap { min-height: 96px; }
    .res-wpm { font-size: 34px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .track { transition: none; }
    .l.caret, .ce.on { animation: none; }
    .l.caret { border-left-color: var(--accent); }
    .ce.on { background-color: var(--accent); }
    .seg button, .btn, .l, .w { transition: none; }
  }
</style>
</head>
<body data-screen="test">
  <header>
    <div class="brand">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h.01M18 14h.01M9 14h6"/></svg>
      <span>Typing Speed</span>
    </div>
    <div class="hint"><kbd>Tab</kbd> + <kbd>Enter</kbd> — заново · <kbd>Esc</kbd> — сброс</div>
  </header>

  <div class="bar">
    <div class="seg" role="group" aria-label="Язык">
      <button type="button" data-lang="ru" aria-pressed="true">Русский</button>
      <button type="button" data-lang="en" aria-pressed="false">English</button>
    </div>
    <div class="seg" role="group" aria-label="Режим">
      <button type="button" data-mode="time" data-dur="15" aria-pressed="true">15</button>
      <button type="button" data-mode="time" data-dur="30" aria-pressed="false">30</button>
      <button type="button" data-mode="time" data-dur="60" aria-pressed="false">60</button>
      <button type="button" data-mode="words" data-dur="25" aria-pressed="false">25 слов</button>
    </div>
    <button type="button" class="btn icon" id="restart" aria-label="Заново">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
  </div>

  <div class="meta">
    <span id="timer">Осталось 15 с</span>
    <span>WPM <b id="wpm">0</b></span>
  </div>

  <div class="stage">
    <div class="test" id="test">
      <div class="viewport" id="viewport">
        <div class="track" id="track">
          <div class="words" id="words"></div>
        </div>
      </div>
      <input id="input" class="typeinput" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Поле ввода текста">
    </div>

    <div class="result" id="result">
      <div class="res-top">
        <div class="res-wpm" id="resWpm">0</div>
        <div class="res-unit">слов в минуту</div>
        <div class="chip" id="resRating">Новичок</div>
        <div class="chip" id="resRecord" hidden>Новый рекорд</div>
      </div>
      <div class="res-stats">
        <div class="cell"><span>Сырая скорость</span><b id="resRaw">0</b></div>
        <div class="cell"><span>Точность</span><b id="resAcc">100%</b></div>
        <div class="cell"><span>Верные символы</span><b id="resOk">0</b></div>
        <div class="cell"><span>Ошибочные символы</span><b class="err" id="resBad">0</b></div>
      </div>
      <div class="chart-wrap"><canvas id="chart" aria-label="График скорости по секундам" role="img"></canvas></div>
      <div class="res-actions">
        <button type="button" class="btn primary" id="again">Заново</button>
        <button type="button" class="btn" id="fresh">Новые слова</button>
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var WORDS = {
    ru: ["и","в","не","на","что","я","с","он","как","а","то","все","она","так","его","но","да","ты","к","у","же","вы","за","бы","по","только","ее","мне","было","вот","от","меня","еще","нет","о","из","ему","теперь","когда","даже","ну","вдруг","ли","если","уже","или","ни","быть","был","него","до","вас","опять","уж","вам","ведь","там","потом","себя","ничего","ей","может","они","тут","где","есть","надо","ней","для","мы","тебя","их","чем","была","сам","чтоб","без","будто","чего","раз","тоже","себе","под","будет","тогда","кто","этот","того","потому","этого","какой","совсем","ним","здесь","этом","один","почти","мой","тем","чтобы","нее","сейчас","были","куда","зачем","всех","никогда","можно","перед","наконец","два","об","другой","хоть","после","над","больше","тот","через","эти","нас","про","всего","них","какая","много","разве","три","эту","моя","впрочем","хорошо","свою","этой","иногда","лучше","чуть","том","нельзя","такой","им","более","всегда","конечно","всю","между","жизнь","день","рука","время","дело","слово","город","вода","земля","дом","сторона","вопрос","место","лицо","дверь","работа","друг","голова","сила","книга","ночь","утро","окно","стол","дорога","небо","солнце","ветер","дерево","птица","река","поле","снег","дождь","огонь","камень","письмо","число","минута","неделя","месяц","страна","народ","язык","школа","учитель","студент","врач","машина","поезд","самолет","море","гора","лес","цветок","трава","лист","хлеб","молоко","чай","кофе","обед","ужин","завтрак","деньги","магазин","улица","площадь","музей","театр","музыка","песня","фильм","картина","история","наука","техника","компьютер","телефон","экран","кнопка","файл","программа","система","задача","ответ","пример","правило","ошибка","результат","скорость","печать","текст","буква","строка","страница","начало","конец","путь","шаг","движение","свет","тень","звук","голос","тишина","мысль","память","сердце","душа","счастье","радость","страх","надежда","любовь","дружба","семья","мать","отец","сын","дочь","брат","сестра","ребенок","человек","люди","женщина","мужчина","девушка","парень","гость","сосед","начальник","команда","группа","общество","закон","право","свобода","выбор","цель","план","идея","проект","отдых","спорт","игра","победа","удача","случай","событие","новость","газета","журнал","статья","автор","читатель","зритель","слушатель"],
    en: ["the","be","to","of","and","a","in","that","have","it","for","not","on","with","he","as","you","do","at","this","but","his","by","from","they","we","say","her","she","or","an","will","my","one","all","would","there","their","what","so","up","out","if","about","who","get","which","go","me","when","make","can","like","time","no","just","him","know","take","people","into","year","your","good","some","could","them","see","other","than","then","now","look","only","come","its","over","think","also","back","after","use","two","how","our","work","first","well","way","even","new","want","because","any","these","give","day","most","us","is","are","was","were","been","has","had","did","does","said","made","went","came","got","put","keep","let","may","must","might","should","shall","very","much","many","more","less","little","big","small","long","short","high","low","old","young","right","left","same","different","next","last","early","late","hard","easy","open","close","start","stop","find","help","show","tell","ask","call","need","feel","try","leave","move","live","play","run","walk","read","write","learn","teach","build","break","change","grow","hold","turn","send","bring","buy","sell","pay","meet","sit","stand","sleep","eat","drink","water","food","house","room","door","window","street","city","country","world","place","point","part","side","line","word","name","number","night","morning","light","dark","sound","voice","music","story","book","page","letter","screen","phone","table","chair","car","train","plane","road","river","sea","mountain","forest","tree","flower","grass","snow","rain","fire","stone","sun","moon","sky","wind","hand","head","eye","face","heart","mind","life","death","love","friend","family","mother","father","son","daughter","brother","sister","child","man","woman","girl","boy","team","group","school","teacher","student","doctor","money","shop","museum","theater","science","system","answer","example","rule","error","result","speed","text","begin","finish","path","step","choice","plan","idea","project","rest","sport","game","win","luck","case","event","news","paper","author","reader"]
  };

  var EXTRA = 6;
  var TIME_WORDS = 200;
  var WORDS_MODE = 25;

  var el = {
    test: document.getElementById("test"),
    viewport: document.getElementById("viewport"),
    track: document.getElementById("track"),
    words: document.getElementById("words"),
    input: document.getElementById("input"),
    timer: document.getElementById("timer"),
    wpm: document.getElementById("wpm"),
    result: document.getElementById("result"),
    resWpm: document.getElementById("resWpm"),
    resRating: document.getElementById("resRating"),
    resRecord: document.getElementById("resRecord"),
    resRaw: document.getElementById("resRaw"),
    resAcc: document.getElementById("resAcc"),
    resOk: document.getElementById("resOk"),
    resBad: document.getElementById("resBad"),
    chart: document.getElementById("chart"),
    again: document.getElementById("again"),
    fresh: document.getElementById("fresh"),
    restart: document.getElementById("restart")
  };

  var state = {
    lang: "ru",
    mode: "time",
    duration: 15,
    words: [],
    typed: [],
    cur: 0,
    started: false,
    finished: false,
    startTime: 0,
    samples: [],
    lastSecond: 0,
    timerId: null,
    wordEls: [],
    rowH: 0
  };

  function calcStats(correctChars, totalTyped, errors, seconds) {
    var mins = Math.max(seconds, 0.001) / 60;
    var wpm = Math.max(0, Math.round((correctChars / 5) / mins));
    var raw = Math.max(0, Math.round((totalTyped / 5) / mins));
    var acc = totalTyped > 0 ? ((totalTyped - errors) / totalTyped) * 100 : 100;
    acc = Math.max(0, Math.min(100, acc));
    return { wpm: wpm, raw: raw, accuracy: Math.round(acc * 10) / 10 };
  }

  function ratingOf(wpm) {
    if (wpm < 25) return "Новичок";
    if (wpm < 45) return "Любитель";
    if (wpm < 70) return "Уверенно";
    if (wpm < 100) return "Быстро";
    return "Мастер";
  }

  function pickWords(n) {
    var pool = WORDS[state.lang];
    var out = [];
    var prev = -1;
    for (var i = 0; i < n; i++) {
      var k = Math.floor(Math.random() * pool.length);
      while (k === prev) k = Math.floor(Math.random() * pool.length);
      prev = k;
      out.push(pool[k]);
    }
    return out;
  }

  function modeKey() {
    return state.mode === "words" ? "25w" : String(state.duration);
  }

  function bestKey() {
    return "typing-speed:best:" + state.lang + ":" + modeKey();
  }

  function readBest(key) {
    try {
      var v = parseInt(window.localStorage.getItem(key), 10);
      return isNaN(v) ? 0 : v;
    } catch (e) {
      return 0;
    }
  }

  function writeBest(key, value) {
    try {
      window.localStorage.setItem(key, String(value));
    } catch (e) {}
  }

  function makeWordEl(i) {
    var w = state.words[i];
    var node = document.createElement("span");
    node.className = "w";
    node.dataset.i = String(i);
    for (var j = 0; j < w.length; j++) {
      var s = document.createElement("span");
      s.className = "l";
      s.textContent = w.charAt(j);
      node.appendChild(s);
    }
    for (var k = 0; k < EXTRA; k++) {
      var x = document.createElement("span");
      x.className = "l x";
      node.appendChild(x);
    }
    var ce = document.createElement("span");
    ce.className = "ce";
    node.appendChild(ce);
    return node;
  }

  function renderWords() {
    var frag = document.createDocumentFragment();
    state.wordEls = [];
    for (var i = 0; i < state.words.length; i++) {
      var node = makeWordEl(i);
      state.wordEls.push(node);
      frag.appendChild(node);
    }
    el.words.textContent = "";
    el.words.appendChild(frag);
    measure();
    el.track.style.transition = "none";
    el.track.style.transform = "translateY(0px)";
    void el.track.offsetHeight;
    el.track.style.transition = "";
    paintWord(0);
    scrollToRow(0);
  }

  function measure() {
    if (!state.wordEls.length) return;
    state.rowH = state.wordEls[0].offsetHeight || 1;
    el.viewport.style.height = state.rowH * 3 + "px";
  }

  function paintWord(i) {
    var node = state.wordEls[i];
    if (!node) return;
    var w = state.words[i];
    var t = state.typed[i] || "";
    var n = w.length;
    var kids = node.children;
    for (var j = 0; j < n; j++) {
      var cls = "l";
      if (j < t.length) cls += t.charAt(j) === w.charAt(j) ? " ok" : " bad";
      kids[j].className = cls;
    }
    for (var k = 0; k < EXTRA; k++) {
      var s = kids[n + k];
      var idx = n + k;
      if (idx < t.length) {
        s.className = "l x on";
        s.textContent = t.charAt(idx);
      } else {
        s.className = "l x";
        s.textContent = "";
      }
    }
    var ce = kids[n + EXTRA];
    ce.className = "ce";
    if (i === state.cur && !state.finished) {
      if (t.length < n) kids[t.length].classList.add("caret");
      else ce.classList.add("on");
    }
  }

  function scrollToRow(i) {
    var node = state.wordEls[i];
    if (!node || !state.rowH) return;
    var base = state.wordEls[0].offsetTop;
    var row = Math.round((node.offsetTop - base) / state.rowH);
    el.track.style.transform = "translateY(" + (-row * state.rowH) + "px)";
  }

  function updateMeta() {
    if (state.mode === "words") {
      el.timer.textContent = "Слова " + Math.min(state.cur, WORDS_MODE) + "/" + WORDS_MODE;
    } else {
      var left = state.started ? Math.max(0, state.duration - elapsedSec()) : state.duration;
      el.timer.textContent = "Осталось " + Math.ceil(left) + " с";
    }
  }

  function elapsedSec() {
    if (!state.started) return 0;
    return (performance.now() - state.startTime) / 1000;
  }

  function computeProgress() {
    var correct = 0;
    var correctInWords = 0;
    var typedChars = 0;
    var errs = 0;
    for (var i = 0; i < state.words.length; i++) {
      var w = state.words[i];
      var t = state.typed[i] || "";
      if (!t) continue;
      typedChars += t.length;
      var ok = t.length === w.length;
      for (var j = 0; j < t.length; j++) {
        if (j < w.length && t.charAt(j) === w.charAt(j)) correct++;
        else { errs++; ok = false; }
      }
      if (ok) correctInWords += w.length;
    }
    return { correct: correct, correctInWords: correctInWords, typedChars: typedChars, errs: errs };
  }

  function startTimer() {
    if (state.started) return;
    state.started = true;
    state.startTime = performance.now();
    state.samples.push({ t: 0, wpm: 0, errs: 0 });
    state.timerId = window.setInterval(tick, 100);
  }

  function tick() {
    if (state.finished) return;
    var sec = elapsedSec();
    updateMeta();
    if (state.mode === "time" && sec >= state.duration) {
      finish();
      return;
    }
    var whole = Math.floor(sec);
    if (whole > state.lastSecond) {
      state.lastSecond = whole;
      var p = computeProgress();
      var s = calcStats(p.correctInWords, p.typedChars, p.errs, sec);
      state.samples.push({ t: whole, wpm: s.wpm, errs: p.errs });
      el.wpm.textContent = String(s.wpm);
    }
  }

  function appendWords(n) {
    var extra = pickWords(n);
    var frag = document.createDocumentFragment();
    for (var i = 0; i < extra.length; i++) {
      var idx = state.words.length;
      state.words.push(extra[i]);
      state.typed.push("");
      var node = makeWordEl(idx);
      state.wordEls.push(node);
      frag.appendChild(node);
    }
    el.words.appendChild(frag);
  }

  function commitWord() {
    var i = state.cur;
    var node = state.wordEls[i];
    if (!node) return;
    var ok = (state.typed[i] || "") === state.words[i];
    node.classList.add("done");
    node.classList.toggle("err", !ok);
    state.cur++;
    paintWord(i);
    updateMeta();
    if (state.mode === "words" && state.cur >= WORDS_MODE) {
      finish();
      return;
    }
    if (state.cur >= state.words.length - 4) appendWords(60);
    paintWord(state.cur);
    scrollToRow(state.cur);
  }

  function onInput() {
    if (state.finished) return;
    startTimer();
    var v = el.input.value;
    var sp = v.indexOf(" ");
    if (sp !== -1) {
      var head = v.slice(0, sp);
      var rest = v.slice(sp + 1);
      state.typed[state.cur] = head;
      paintWord(state.cur);
      commitWord();
      if (state.finished) return;
      el.input.value = rest;
      if (rest) {
        state.typed[state.cur] = rest;
        paintWord(state.cur);
      }
      return;
    }
    state.typed[state.cur] = v;
    paintWord(state.cur);
  }

  function finish() {
    if (state.finished) return;
    state.finished = true;
    if (state.timerId) {
      window.clearInterval(state.timerId);
      state.timerId = null;
    }
    var sec = Math.max(0.1, elapsedSec());
    var p = computeProgress();
    var s = calcStats(p.correctInWords, p.typedChars, p.errs, sec);
    var last = state.samples.length ? state.samples[state.samples.length - 1] : null;
    if (!last || last.t < Math.max(1, Math.round(sec))) {
      state.samples.push({ t: Math.max(1, Math.round(sec)), wpm: s.wpm, errs: p.errs });
    }
    var key = bestKey();
    var prev = readBest(key);
    var record = s.wpm > prev;
    if (record) writeBest(key, s.wpm);

    el.resWpm.textContent = String(s.wpm);
    el.resRating.textContent = ratingOf(s.wpm);
    el.resRaw.textContent = String(s.raw);
    el.resAcc.textContent = s.accuracy + "%";
    el.resOk.textContent = String(p.correct);
    el.resBad.textContent = String(p.errs);
    el.resRecord.hidden = !record;
    document.body.dataset.screen = "result";
    el.input.blur();
    drawChart();
    el.again.focus();
  }

  function traceLine(ctx, pts, X, Y) {
    ctx.moveTo(X(pts[0].t), Y(pts[0].wpm));
    for (var i = 1; i < pts.length; i++) {
      var x0 = X(pts[i - 1].t);
      var y0 = Y(pts[i - 1].wpm);
      var x1 = X(pts[i].t);
      var y1 = Y(pts[i].wpm);
      var mx = (x0 + x1) / 2;
      ctx.bezierCurveTo(mx, y0, mx, y1, x1, y1);
    }
  }

  function drawChart() {
    var cv = el.chart;
    var wrap = cv.parentElement;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.max(140, wrap.clientWidth);
    var h = Math.max(90, wrap.clientHeight);
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    cv.style.width = w + "px";
    cv.style.height = h + "px";
    var ctx = cv.getContext("2d");
    if (!ctx) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    var padL = 38;
    var padR = 12;
    var padT = 24;
    var padB = 24;
    var iw = w - padL - padR;
    var ih = h - padT - padB;
    var pts = state.samples.length ? state.samples : [{ t: 0, wpm: 0, errs: 0 }];
    var maxT = Math.max(1, pts[pts.length - 1].t);
    var maxW = 0;
    for (var i = 0; i < pts.length; i++) if (pts[i].wpm > maxW) maxW = pts[i].wpm;
    maxW = Math.max(20, Math.ceil(maxW / 20) * 20);

    function X(t) { return padL + (t / maxT) * iw; }
    function Y(v) { return padT + ih - (v / maxW) * ih; }

    ctx.font = '10px "Segoe UI", system-ui, sans-serif';
    ctx.textBaseline = "middle";
    ctx.strokeStyle = "#262932";
    ctx.lineWidth = 1;
    for (var g = 0; g <= 4; g++) {
      var val = (maxW / 4) * g;
      var yy = Math.round(Y(val)) + 0.5;
      ctx.beginPath();
      ctx.moveTo(padL, yy);
      ctx.lineTo(padL + iw, yy);
      ctx.stroke();
      ctx.fillStyle = "#5c6070";
      ctx.textAlign = "right";
      ctx.fillText(String(Math.round(val)), padL - 7, yy);
    }
    ctx.fillStyle = "#5c6070";
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillText("слов/мин", 8, 9);

    var ticks = [0, Math.round(maxT / 2), maxT];
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    for (var k = 0; k < ticks.length; k++) {
      var tx = X(ticks[k]);
      ctx.beginPath();
      ctx.moveTo(tx, padT + ih);
      ctx.lineTo(tx, padT + ih + 4);
      ctx.stroke();
      ctx.fillStyle = "#5c6070";
      ctx.fillText(k === ticks.length - 1 ? ticks[k] + " с" : String(ticks[k]), tx, padT + ih + 7);
    }

    ctx.beginPath();
    traceLine(ctx, pts, X, Y);
    ctx.lineTo(X(pts[pts.length - 1].t), padT + ih);
    ctx.lineTo(X(pts[0].t), padT + ih);
    ctx.closePath();
    ctx.fillStyle = "rgba(255, 209, 102, 0.10)";
    ctx.fill();

    ctx.beginPath();
    traceLine(ctx, pts, X, Y);
    ctx.strokeStyle = "#ffd166";
    ctx.lineWidth = 2;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.stroke();

    var prevErr = 0;
    for (var m = 0; m < pts.length; m++) {
      if (pts[m].errs > prevErr) {
        ctx.beginPath();
        ctx.arc(X(pts[m].t), Y(pts[m].wpm), 3.5, 0, Math.PI * 2);
        ctx.fillStyle = "#ff5c6c";
        ctx.fill();
      }
      prevErr = pts[m].errs;
    }
  }

  function startRun(newWords) {
    if (state.timerId) {
      window.clearInterval(state.timerId);
      state.timerId = null;
    }
    state.finished = false;
    state.started = false;
    state.cur = 0;
    state.startTime = 0;
    state.samples = [];
    state.lastSecond = 0;
    document.body.dataset.screen = "test";
    el.wpm.textContent = "0";
    if (newWords || !state.words.length) {
      state.words = pickWords(state.mode === "words" ? WORDS_MODE : TIME_WORDS);
    }
    state.typed = state.words.map(function () { return ""; });
    el.input.value = "";
    renderWords();
    updateMeta();
    el.input.focus();
  }

  function resetRun() {
    startRun(false);
  }

  function setPressed(group, btn) {
    var nodes = group.querySelectorAll("button");
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].setAttribute("aria-pressed", nodes[i] === btn ? "true" : "false");
    }
  }

  var langGroup = document.querySelector('.seg[aria-label="Язык"]');
  var modeGroup = document.querySelector('.seg[aria-label="Режим"]');

  langGroup.addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn) return;
    setPressed(langGroup, btn);
    state.lang = btn.dataset.lang;
    startRun(true);
  });

  modeGroup.addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn) return;
    setPressed(modeGroup, btn);
    state.mode = btn.dataset.mode;
    state.duration = parseInt(btn.dataset.dur, 10);
    startRun(true);
  });

  el.restart.addEventListener("click", function () { startRun(true); });
  el.again.addEventListener("click", function () { startRun(true); });
  el.fresh.addEventListener("click", function () { startRun(true); });

  el.input.addEventListener("input", onInput);

  el.test.addEventListener("pointerdown", function (e) {
    if (e.target === el.input) return;
    e.preventDefault();
    el.input.focus();
  });

  var tabDown = false;
  document.addEventListener("keydown", function (e) {
    if (e.key === "Tab") {
      tabDown = true;
      if (document.activeElement === el.input) e.preventDefault();
      return;
    }
    if (e.key === "Enter" && tabDown) {
      e.preventDefault();
      tabDown = false;
      startRun(true);
      return;
    }
    if (e.key === "Escape") {
      e.preventDefault();
      resetRun();
    }
  });
  document.addEventListener("keyup", function (e) {
    if (e.key === "Tab") tabDown = false;
  });

  var resizeTimer = null;
  window.addEventListener("resize", function () {
    if (resizeTimer) window.clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(function () {
      measure();
      scrollToRow(state.cur);
      if (document.body.dataset.screen === "result") drawChart();
    }, 120);
  });

  window.calcStats = calcStats;
  window.ratingOf = ratingOf;

  startRun(true);
})();
</script>
</body>
</html>
